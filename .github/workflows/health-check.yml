name: API Health Check

on:
  schedule:
    - cron: "*/1 * * * *"

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call API health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          URL="${HEALTHCHECK_URL}"
          echo "Checking ${URL}"
          curl --fail --show-error --silent \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            "$URL"
