name: Mobile Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/JapanDictApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/JapanDictApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android preview
        run: npx expo prebuild --platform android && cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Rename APK
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/release/app-release.apk | head -n 1)
          mv "$APK_PATH" "$GITHUB_WORKSPACE/japan-dict-${{ github.run_number }}.apk"

      # - name: Upload APK artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: japan-dict-${{ github.run_number }}
      #     path: japan-dict-${{ github.run_number }}.apk

      - name: Prepare release metadata
        id: release_meta
        run: |
          echo "tag=android-release-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Android Release #${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          generate_release_notes: true
          files: japan-dict-${{ github.run_number }}.apk
